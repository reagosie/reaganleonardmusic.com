<!--
  Site footer — contact details, social links, badges, a photo and the
  JotForm booking request form. Shared by every page that has a footer.
  To change it: edit here, then run  py tools/sync-shell.py

  Layout (styles: "Footer" section of site.css):
    desktop  — two columns: contact / social / badges / photo on the left,
               "Check my availability…" + the full booking form on the right
               (the form ends a little below the photo; nothing scrolls).
    mobile   — stacked: heading, form, photo, contact, social, badges.
  The form is JotForm's own <iframe>, injected by site.js when the footer
  scrolls near. It is kept at most 760px wide so JotForm always uses its
  compact layout, and site.js trims JotForm's blank top margin and its
  promotional footer off the iframe (JOTFORM_TOP / JOTFORM_BANNER in site.js).
-->
