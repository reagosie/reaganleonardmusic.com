<script>
  window.addEventListener("message", function(e) {
    if (typeof e.data === "string" && e.data.indexOf("setHeight") > -1) {
      var iframe = document.querySelector('iframe[src*="jotform"]');
      if (iframe) {
        var height = e.data.split(":")[1];
        iframe.style.height = height + "px";
      }
    }
  });
</script>
